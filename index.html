<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Powersbank - 专注于帮助初创企业融资的金融服务公司。提交您的商业计划书，让我们助您一臂之力。" />
  <meta name="keywords" content="Powersbank,初创企业融资,金融服务,商业计划书,BP,风险投资" />
  <meta name="author" content="Powersbank" />
  <link rel="canonical" href="https://www.powersbank.com.cn" />
  <title>Powersbank - 初创企业融资服务</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-bg: #f8f9fb;
      --color-primary: #0a1628;
      --color-accent: #c4963a;
      --color-accent-hover: #d4a853;
      --color-accent-light: #fef9f0;
      --color-text: #1a1a2e;
      --color-text-secondary: #5a6270;
      --color-white: #ffffff;
      --color-border: #e2e6ed;
      --color-success: #16a34a;
      --color-error: #dc2626;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* 背景装饰 */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.04;
    }

    .bg-circle-1 {
      width: 600px;
      height: 600px;
      background: var(--color-accent);
      top: -200px;
      right: -150px;
    }

    .bg-circle-2 {
      width: 400px;
      height: 400px;
      background: var(--color-primary);
      bottom: -100px;
      left: -100px;
    }

    .bg-circle-3 {
      width: 200px;
      height: 200px;
      background: var(--color-accent);
      top: 50%;
      left: 60%;
      transform: translate(-50%, -50%);
    }

    /* 主容器 */
    .main-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 720px;
      padding: 40px 24px;
      text-align: center;
    }

    /* Logo / 图标 */
    .logo-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      background: var(--color-primary);
      border-radius: 18px;
      margin-bottom: 36px;
      box-shadow: 0 8px 32px rgba(10, 22, 40, 0.15);
    }

    .logo-mark svg {
      width: 38px;
      height: 38px;
    }

    /* 公司名称 */
    .company-name {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--color-primary);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .company-name .dot {
      color: var(--color-accent);
    }

    /* 分割线 */
    .divider {
      display: block;
      width: 60px;
      height: 3px;
      background: var(--color-accent);
      margin: 0 auto 24px;
      border-radius: 2px;
    }

    /* 描述文字 */
    .tagline {
      font-size: 18px;
      color: var(--color-text-secondary);
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 48px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }

    /* ========== BP 上传卡片 ========== */
    .bp-card {
      background: var(--color-white);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.04);
      text-align: left;
      max-width: 520px;
      margin: 0 auto;
    }

    .bp-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .bp-icon {
      width: 48px;
      height: 48px;
      background: var(--color-accent-light);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .bp-icon svg {
      width: 24px;
      height: 24px;
      color: var(--color-accent);
    }

    .bp-title-group h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text);
      margin-bottom: 2px;
    }

    .bp-title-group p {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    /* 表单 */
    .bp-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: 6px;
    }

    .form-group label .required {
      color: var(--color-error);
      margin-left: 2px;
    }

    .form-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--color-text);
      background: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(196, 150, 58, 0.12);
      background: var(--color-white);
    }

    .form-input::placeholder {
      color: #b0b7c3;
    }

    textarea.form-input {
      resize: vertical;
      min-height: 80px;
    }

    /* 文件上传区域 */
    .file-upload-area {
      position: relative;
      border: 2px dashed var(--color-border);
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafbfc;
    }

    .file-upload-area:hover,
    .file-upload-area.drag-over {
      border-color: var(--color-accent);
      background: var(--color-accent-light);
    }

    .file-upload-area.has-file {
      border-color: var(--color-success);
      border-style: solid;
      background: #f0fdf4;
    }

    .file-upload-icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      color: var(--color-accent);
    }

    .file-upload-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: 4px;
    }

    .file-upload-hint {
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    .file-input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .file-selected {
      display: none;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 10px 14px;
      background: #f0fdf4;
      border-radius: 8px;
      font-size: 13px;
      color: var(--color-success);
    }

    .file-selected.visible {
      display: flex;
    }

    .file-selected svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .file-selected .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-selected .file-remove {
      background: none;
      border: none;
      cursor: pointer;
      color: #9ca3af;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }

    .file-selected .file-remove:hover {
      color: var(--color-error);
      background: #fef2f2;
    }

    /* 提交按钮 */
    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 32px;
      background: var(--color-accent);
      color: var(--color-white);
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.2s;
      width: 100%;
    }

    .submit-btn:hover {
      background: var(--color-accent-hover);
      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .submit-btn.loading .spinner {
      display: block;
    }

    .submit-btn.loading .btn-text {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 状态消息 */
    .form-status {
      display: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
    }

    .form-status.visible {
      display: block;
    }

    .form-status.success {
      background: #f0fdf4;
      color: var(--color-success);
      border: 1px solid #bbf7d0;
    }

    .form-status.error {
      background: #fef2f2;
      color: var(--color-error);
      border: 1px solid #fecaca;
    }

    /* 底部信息 */
    .footer-info {
      margin-top: 48px;
      font-size: 13px;
      color: #9ca3af;
    }

    .footer-info a {
      color: #9ca3af;
      text-decoration: none;
    }

    .footer-info a:hover {
      color: var(--color-accent);
    }

    /* ========== 响应式 ========== */
    @media (max-width: 640px) {
      .main-container {
        padding: 32px 20px;
      }

      .company-name {
        font-size: 36px;
        letter-spacing: 1px;
      }

      .tagline {
        font-size: 15px;
        margin-bottom: 36px;
      }

      .bp-card {
        padding: 24px 20px;
        border-radius: 12px;
      }

      .bp-card-header {
        gap: 10px;
        margin-bottom: 22px;
      }

      .bp-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
      }

      .bp-icon svg {
        width: 20px;
        height: 20px;
      }

      .bp-title-group h3 {
        font-size: 16px;
      }

      .logo-mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        margin-bottom: 28px;
      }

      .logo-mark svg {
        width: 30px;
        height: 30px;
      }

      .file-upload-area {
        padding: 18px 14px;
      }

      .submit-btn {
        padding: 14px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- 背景装饰 -->
  <div class="bg-decoration" aria-hidden="true">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>
  </div>

  <!-- 主内容 -->
  <main class="main-container">

    <!-- Logo -->
    <div class="logo-mark">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="8" width="34" height="22" rx="3" stroke="#D4A853" stroke-width="2.5" fill="none"/>
        <path d="M10 16L16 22L10 28" stroke="#D4A853" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 18H28" stroke="#D4A853" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M18 24H26" stroke="#D4A853" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- 公司名称 -->
    <h1 class="company-name">
      Powers<span class="dot">bank</span>
    </h1>

    <!-- 分割线 -->
    <span class="divider"></span>

    <!-- 定位描述 -->
    <p class="tagline">
      专注于为初创企业提供融资咨询与资本对接服务<br>助力创新者将愿景变为现实
    </p>

    <!-- BP 上传卡片 -->
    <div class="bp-card">
      <div class="bp-card-header">
        <div class="bp-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2H6C4.89543 2 4 2.89543 4 4V20C4 21.1046 4.89543 22 6 22H18C19.1046 22 20 21.1046 20 20V8L14 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 2V8H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 18V12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M9 15H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="bp-title-group">
          <h3>提交商业计划书</h3>
          <p>上传您的 BP，我们将在 48 小时内回复</p>
        </div>
      </div>

      <!-- 表单 -->
      <form
        class="bp-form"
        id="bp-form"
        action="https://formly.email/submit"
        method="POST"
        enctype="multipart/form-data"
      >
        <!-- Formly.email Access Key -->
        <input type="hidden" name="access_key" value="4a44509e8fbf41e3b801f8b544429f43" />
        <!-- 邮件主题 -->
        <input type="hidden" name="subject" value="[Powersbank] 商业计划书提交 - BP Submission" />
        <!-- 自定义发件人名称 -->
        <input type="hidden" name="from_name" value="Powersbank BP Submission" />

        <!-- 姓名 -->
        <div class="form-group">
          <label for="name">姓名 <span class="required">*</span></label>
          <input
            type="text"
            id="name"
            name="name"
            class="form-input"
            placeholder="请输入您的姓名"
            required
          />
        </div>

        <!-- 邮箱 -->
        <div class="form-group">
          <label for="email">邮箱 <span class="required">*</span></label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="请输入您的邮箱"
            required
          />
        </div>

        <!-- 公司/项目名称 -->
        <div class="form-group">
          <label for="company">公司 / 项目名称</label>
          <input
            type="text"
            id="company"
            name="company"
            class="form-input"
            placeholder="请输入公司或项目名称（选填）"
          />
        </div>

        <!-- 文件上传 -->
        <div class="form-group">
          <label>商业计划书 <span class="required">*</span></label>
          <div class="file-upload-area" id="file-upload-area">
            <div class="file-upload-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M21 15V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17 8L12 3L7 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 3V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <p class="file-upload-text">点击上传或拖拽文件到此处</p>
            <p class="file-upload-hint">支持 Word、PDF、PPT 格式，最大 10MB</p>
            <input
              type="file"
              id="attachment"
              name="attachment"
              class="file-input"
              accept=".doc,.docx,.pdf,.ppt,.pptx"
              required
            />
          </div>
          <div class="file-selected" id="file-selected">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span class="file-name" id="file-name"></span>
            <button type="button" class="file-remove" id="file-remove" aria-label="移除文件">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- 留言 -->
        <div class="form-group">
          <label for="message">留言</label>
          <textarea
            id="message"
            name="message"
            class="form-input"
            placeholder="如有任何补充说明，请在此留言（选填）"
            rows="3"
          ></textarea>
        </div>

        <!-- 提交按钮 -->
        <button type="submit" class="submit-btn" id="submit-btn">
          <span class="btn-text">提交商业计划书</span>
          <span class="spinner"></span>
        </button>

        <!-- 状态消息 -->
        <div class="form-status" id="form-status"></div>
      </form>
    </div>

    <!-- 底部 -->
    <p class="footer-info">
      &copy; 2026 Powersbank &nbsp;|&nbsp; <a href="mailto:info@powersbank.com.cn">info@powersbank.com.cn</a>
    </p>

  </main>

  <script>
    (function () {
      var fileInput = document.getElementById('attachment');
      var fileUploadArea = document.getElementById('file-upload-area');
      var fileSelected = document.getElementById('file-selected');
      var fileName = document.getElementById('file-name');
      var fileRemove = document.getElementById('file-remove');
      var form = document.getElementById('bp-form');
      var submitBtn = document.getElementById('submit-btn');
      var formStatus = document.getElementById('form-status');

      // 文件选择
      fileInput.addEventListener('change', function () {
        if (fileInput.files.length > 0) {
          var file = fileInput.files[0];
          fileName.textContent = file.name + ' (' + formatFileSize(file.size) + ')';
          fileSelected.classList.add('visible');
          fileUploadArea.classList.add('has-file');
        }
      });

      // 拖拽支持
      fileUploadArea.addEventListener('dragover', function (e) {
        e.preventDefault();
        fileUploadArea.classList.add('drag-over');
      });

      fileUploadArea.addEventListener('dragleave', function () {
        fileUploadArea.classList.remove('drag-over');
      });

      fileUploadArea.addEventListener('drop', function (e) {
        e.preventDefault();
        fileUploadArea.classList.remove('drag-over');
        if (e.dataTransfer.files.length > 0) {
          fileInput.files = e.dataTransfer.files;
          fileInput.dispatchEvent(new Event('change'));
        }
      });

      // 移除文件
      fileRemove.addEventListener('click', function (e) {
        e.stopPropagation();
        fileInput.value = '';
        fileSelected.classList.remove('visible');
        fileUploadArea.classList.remove('has-file');
      });

      // 表单提交
      form.addEventListener('submit', function (e) {
        e.preventDefault();

        // 验证文件
        if (!fileInput.files.length) {
          showStatus('请上传商业计划书文件', 'error');
          return;
        }

        var file = fileInput.files[0];
        var maxSize = 10 * 1024 * 1024; // 10MB

        if (file.size > maxSize) {
          showStatus('文件大小超过 10MB 限制，请压缩后重新上传', 'error');
          return;
        }

        // 提交
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;
        hideStatus();

        var formData = new FormData(form);

        var xhr = new XMLHttpRequest();
        xhr.open('POST', form.action, true);

        xhr.onload = function () {
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;

          if (xhr.status >= 200 && xhr.status < 300) {
            showStatus('提交成功！我们会尽快回复您。', 'success');
            form.reset();
            fileSelected.classList.remove('visible');
            fileUploadArea.classList.remove('has-file');
          } else {
            showStatus('提交失败，请稍后重试或直接发送邮件至 info@powersbank.com.cn', 'error');
          }
        };

        xhr.onerror = function () {
          submitBtn.classList.remove('loading');
          submitBtn.disabled = false;
          showStatus('网络错误，请检查网络后重试', 'error');
        };

        xhr.send(formData);
      });

      function showStatus(msg, type) {
        formStatus.textContent = msg;
        formStatus.className = 'form-status visible ' + type;
      }

      function hideStatus() {
        formStatus.className = 'form-status';
      }

      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }
    })();
  </script>

</body>
</html>
